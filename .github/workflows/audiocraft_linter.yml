name: AudioCraft full lint (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_linter:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/audiocraft_build
      - run: |
          . env/bin/activate
          make linter
