name: AudioCraft full suite (manual)
# The fork's CPU regressions run on every push in fart_tests.yml. The full
# upstream suite installs the complete AudioCraft stack and downloads models.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/audiocraft_build
      - name: Run unit tests
        run: |
          . env/bin/activate
          make tests
      - name: Run integration tests
        run: |
          . env/bin/activate
          make tests_integ
