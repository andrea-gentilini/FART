name: FART regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-fart-tests.txt
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-fart-tests.txt
      - name: Run fork regression tests
        run: python -m pytest tests/fart -q
      - name: Check modified Python code
        run: |
          python -m flake8 audiocraft/utils/audio_tokenizer.py audiocraft/solvers/musicgen.py audiocraft/models/musicgen.py audiocraft/models/lm.py audiocraft/data/music_dataset.py make_jamendo_subset.py scripts/fart_tokenizer.py scripts/fart_codec_smoke.py tests/fart
          python -m compileall -q audiocraft make_jamendo_subset.py
